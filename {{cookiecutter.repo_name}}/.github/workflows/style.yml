name: Code Style

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '{{cookiecutter.module_name}}/locale/**'
      - '{{cookiecutter.module_name}}/static/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '{{cookiecutter.module_name}}/locale/**'
      - '{{cookiecutter.module_name}}/static/**'

jobs:
  isort:
    name: isort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: {{ "${{ runner.os }}-pip-${{ hashFiles('**/setup.py') }}" }}
          restore-keys: |
            {{ "${{ runner.os }}-pip-" }}
      - name: Install Dependencies
        run: pip3 install isort
      - name: Run isort
        run: isort -c .
  flake:
    name: flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: {{ "${{ runner.os }}-pip-${{ hashFiles('**/setup.py') }}" }}
          restore-keys: |
            {{ "${{ runner.os }}-pip-" }}
      - name: Install Dependencies
        run: pip3 install flake8
      - name: Run flake8
        run: flake8 .
        working-directory: .
  black:
    name: black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: {{ "${{ runner.os }}-pip-${{ hashFiles('**/setup.py') }}" }}
          restore-keys: |
            {{ "${{ runner.os }}-pip-" }}
      - name: Install Dependencies
        run: pip3 install black
      - name: Run black
        run: black --check .
        working-directory: .
  packaging:
    name: packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: {{ "${{ runner.os }}-pip-${{ hashFiles('**/setup.py') }}" }}
          restore-keys: |
            {{ "${{ runner.os }}-pip-" }}
      - name: Install Dependencies
        run: pip3 install twine check-manifest pretix-plugin-build setuptools build
      - name: Run check-manifest
        run: check-manifest .
        working-directory: .
      - name: Build package
        run: python setup.py sdist
        working-directory: .
      - name: Check package
        run: twine check dist/*
        working-directory: .
